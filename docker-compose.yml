name: kaneas

services:
  php:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/dev-entrypoint.sh:/usr/local/bin/kaneas-dev-entrypoint:ro
    entrypoint: ["sh", "/usr/local/bin/kaneas-dev-entrypoint"]
    environment:
      # Development only: the database is installed automatically on first start
      # (and again after `docker compose down -v`) with these accounts.
      KANEAS_DEV_ADMIN_NAME: Dev Admin
      KANEAS_DEV_ADMIN_EMAIL: admin@example.com
      KANEAS_DEV_ADMIN_PASSWORD: password
      KANEAS_DEV_USER_NAME: Dev User
      KANEAS_DEV_USER_EMAIL: user@example.com
      KANEAS_DEV_USER_PASSWORD: password
      KANEAS_DEV_APP_URL: http://localhost:4200/
      KANEAS_DEV_DB_PREFIX: kb_
      KANEAS_DEV_DB_HOST: db
      KANEAS_DEV_DB_PORT: "3306"
      KANEAS_DEV_DB_NAME: kaneas
      KANEAS_DEV_DB_USER: kaneas
      KANEAS_DEV_DB_PASS: kaneas
    depends_on:
      db:
        condition: service_healthy

  # Serves the deployable build (npm run build) from a sub folder, like shared hosting:
  #   docker compose --profile release up -d  ->  http://localhost:8090/kanban/install/
  release:
    profiles: ["release"]
    build: ./docker/php
    ports:
      - "8090:80"
    volumes:
      - ./dist/kaneas:/var/www/html/kanban
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaneas
      MYSQL_USER: kaneas
      MYSQL_PASSWORD: kaneas
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  db_data:
